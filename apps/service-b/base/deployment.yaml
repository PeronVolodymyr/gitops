apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  labels:
    app.kubernetes.io/name: service-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-b
    spec:
      containers:
        - name: service-b
          image: service-b:placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
