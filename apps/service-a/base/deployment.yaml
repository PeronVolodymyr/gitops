apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  labels:
    app.kubernetes.io/name: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-a
    spec:
      containers:
        - name: service-a
          image: service-a:placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: QUARKUS_HTTP_PORT
              value: "8080"
            - name: QUARKUS_REST_CLIENT_SERVICE_B_URL
              value: http://service-b:8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
